  title: The M1 governor cannot physically shrink upstream's fixed bank
  verdict: CONFIRMED
  severity: High
  action: fix now
  why: Means 8/6.5/6.5/7.5. The bank is allocated at construction. Invalidating slots or pausing admission cannot reclaim
    VRAM, so the promised M1.3 response to a competing allocation cannot pass as written.
  fix: Choose either supervised restart into a smaller parity-qualified plan or genuinely reclaimable bank segments with safe
    reader draining and graph rebinding. Test recovered driver-budget usage, not merely slot occupancy.
