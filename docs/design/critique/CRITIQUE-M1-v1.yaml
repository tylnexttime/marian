  title: 'PERF: Put a minimal bounded expert source before the M1 throughput exit'
  verdict: PLAUSIBLE
  severity: High
  action: fix now
  why: Means 8/6/7/8. P3 is deferred although M1 requires sustained 12 tok/s. At an illustrative 85% byte hit rate, about
    99 MiB/token still misses; storage service could dominate, but neither paging causality nor failure on the new pin is
    measured. The byte-preserving remedy could have no gain without paging or recover a substantial post-prefill slowdown.
  fix: First run matched cold and pp4096/16K-to-decode endurance tests. If the floor or stability fails, advance bounded RAM,
    pinned staging and queued tail sourcing into M1, covering both small-cache fills and large-batch copies. Put source hooks
    in llama.cpp and tier management above it.
