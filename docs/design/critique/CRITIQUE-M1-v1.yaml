brief_challenges:
- challenge: Define the 85% target independently of stock's arithmetic 33% layer share and Strata's 85.4% aggregate under
    different execution settings.
  kind: framing
  raised_by:
  - sol
  - luna
  - astra
  why_it_matters: Median per-token lookups, aggregate lookups, byte hits and bytes per committed token can differ. Specify
    matched workload, budget, warm state, batching and denominator.
- challenge: 'Identify the available exactness oracle for Swift: all of its routed experts cannot reside on the reference
    16 GB GPU.'
  kind: missing scope
  raised_by:
  - sol
  - astra
  why_it_matters: Single-layer and alternative-path parity are useful but do not literally execute the stipulated whole-Swift
    same-GPU reference.
- challenge: Replace unrestricted 'any machine' success language with a supported matrix and explicit degraded, unsupported
    or refusal outcomes.
  kind: wrong assumption
  raised_by:
  - sol
  - luna
  - astra
  why_it_matters: An 8 GB ballast and RAM cap cannot reproduce another GPU, Linux, PCIe 3.0 or slow NVMe; calibration cannot
    guarantee useful throughput from insufficient resources.
- challenge: Specify deployment and rollback deliverables separately from feature completion.
  kind: missing scope
  raised_by:
  - astra
  why_it_matters: A supported-configuration matrix, launch checks, health/error semantics, diagnostics and rollback are needed
    before a newcomer can rely on the calibration.
data_checks:
- cid: C-03
  kind: command
  check: On the pinned build, run read-only llama-bench decode at matched cache budgets both alone and immediately after pp4096/pp16K;
    record tok/s, physical disk reads, faults and available RAM without clearing caches.
  settles: Whether unmanaged expert sourcing actually threatens the M1 decode floor on the reference workload.
- cid: C-06
  kind: read
  check: Feed a synthetic multirow ID trace containing duplicate experts through plan() and independently count row-level
    pre-admission residency.
  settles: The precise difference between upstream distinct-expert counters and the proposed lookup denominator.
- cid: C-07
  kind: command
  check: Instrument a pinned-build run with host timestamps plus GPU completion events around ID retrieval, fill submission,
    slot-map publication and consumer execution; compare against an instrumentation-off run.
  settles: Avoidable drain time versus preceding GPU work, actual bank-ready time and tracing overhead.
- cid: C-08
  kind: command
  check: Compare the standalone probe's predicted safe budget with loaded-server runs at requested context and peak ubatch,
    including a controlled competing GPU allocation; sample driver local-budget usage and throughput.
  settles: Whether the proposed probe predicts a safe serving allocation rather than only a small-operation bound.
- cid: C-10
  kind: read
  check: For matched Swift cache-on, cache-off and selective-copy runs, inspect per-expert operation/backend traces and row
    counts before comparing saved logits.
  settles: Whether E2b isolates two GPU numerical paths or inadvertently includes CPU computation.
- cid: C-11
  kind: command
  check: For identical short prompts, measure cold TTFT and subsequent hit rate with full ranked warm fill versus a small
    synchronous core and deferred fill; record bytes physically read before first token.
  settles: Whether deferred warm fill improves startup without an unacceptable hit-rate cost.
- cid: C-13
  kind: read
  check: Generate a parity matrix of actual kernel/backend and intermediate-output hashes for rows 1, 7, 8, 9, 32, capacity
    fallback and selected large ubatches, for all three Swift layouts.
  settles: Which disclosed dispatch boundaries the exactness gate really covers.
- cid: C-18
  kind: command
  check: On matched high-acceptance prompts, compare opt-in seven- and eight-total-row verification by committed tokens, expert
    bytes and wall milliseconds, recording selected kernels.
  settles: Whether the eighth row pays despite the IQ2_S MMQ transition.
- cid: C-19
  kind: command
  check: On recorded demand traces, count contiguous upload runs and host submission microseconds before and after ranked/transient
    placement; separately test any packed transfer on CUDA 12.8.
  settles: Whether fragmented fills create material exposed submission overhead and whether batching recovers it.
- cid: C-20
  kind: command
  check: Across counterbalanced ABBA rounds, record physical model reads, available RAM and faults at the start and during
    each arm; interleave repeated A-A controls.
  settles: Whether the claimed equivalent page-cache starting states and noise floor hold.
- cid: C-23
  kind: command
  check: Using the qualified server configuration, submit one then two simultaneous local requests while recording realized
    rows per MUL_MAT_ID, cache-path selection, peak VRAM and request outcomes.
  settles: Whether concurrency changes numerical-path geometry or exceeds the calibrated memory envelope.
problems: []
