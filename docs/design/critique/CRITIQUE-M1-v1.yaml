  cid: C-20
  title: Identical warm-up in fresh processes does not equalize page-cache history
  verdict: CONFIRMED
  severity: High
  action: fix now
  why: Means 7.5/7/3.5/4. Process exit retains OS-cached pages, and one arm may warm or displace the next arm’s data. This
    can distort the decode floor and apparent optimisation gains; the older slowdown’s cause is not proven.
  fix: Separate cold, controlled-warm and post-prefill runs; counterbalance order, freeze learning, log starting memory state,
    physical reads and faults, and repeat A–A controls.
